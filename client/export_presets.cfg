exclude_filter="tools/*,test-results/*,release/*,published-world.mjs"
export_path="release/Hearthvale-Godot-0.2.22.exe"

[preset.0.options]
custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
